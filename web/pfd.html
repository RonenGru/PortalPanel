<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PortalPanel PFD</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; font-family: 'Courier New', monospace; }
        #pfd-canvas { display: block; }
        #status-bar {
            position: fixed; top: 0; left: 0; right: 0;
            background: #0a0a0a; color: #00FF00;
            font-size: 11px; padding: 3px 10px;
            display: flex; justify-content: space-between;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="status-bar">
        <span id="status-text">Connecting...</span>
        <span id="fps-text">0 fps</span>
    </div>
    <canvas id="pfd-canvas" width="600" height="600"></canvas>

    <script>
    // =====================================================
    // PORTALPANEL PFD - Primary Flight Display
    // =====================================================

    const canvas = document.getElementById('pfd-canvas');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('status-text');
    const fpsText = document.getElementById('fps-text');

    const W = canvas.width;
    const H = canvas.height;
    const CX = W / 2;
    const CY = H / 2;

        // Data store
    let d = {};
    // Interpolation: smoothly animate toward target values
    let smooth = {
        pitch: 0, roll: 0, airspeed: 0,
        altitude: 0, heading_mag: 0, vertical_speed: 0,
        baro_pressure: 1013, turn_rate: 0, slip_ball: 0,
        nav1_freq: 0, nav2_freq: 0
    };
    const SMOOTH_FACTOR = 0.35; // Higher = snappier, Lower = smoother
    let lastFrameTime = performance.now();
    let frameCount = 0;
    let lastFpsTime = performance.now();

    // =====================================================
    // FETCH LIVE DATA
    // =====================================================
    async function fetchData() {
        try {
            const response = await fetch('/api/data');
            const json = await response.json();
            d = json.data || {};
            statusText.textContent = json.message || 'Unknown';
            statusText.style.color = json.connected ? '#00FF00' : '#FF8800';
        } catch (e) {
            statusText.textContent = 'Connection error: ' + e.message;
            statusText.style.color = '#FF0000';
        }
    }

        // =====================================================
    // DRAW ATTITUDE INDICATOR (Artificial Horizon)
    // =====================================================
        function drawAttitudeIndicator() {
        var pitch = smooth.pitch || 0;
        var roll = smooth.roll || 0;
        var pxPerDeg = 5; // pixels per degree of pitch

        // Save context, clip to circle
        ctx.save();
        ctx.beginPath();
        ctx.arc(CX, CY, 240, 0, Math.PI * 2);
        ctx.clip();

        // Save again for rotation/translation
        ctx.save();
        ctx.translate(CX, CY);
        ctx.rotate(roll * Math.PI / 180);

        var pitchOffset = pitch * pxPerDeg;

        // Sky (blue)
        ctx.fillStyle = '#0099FF';
        ctx.fillRect(-600, -600 - pitchOffset, 1200, 600);

        // Ground (brown)
        ctx.fillStyle = '#996633';
        ctx.fillRect(-600, 0 - pitchOffset, 1200, 600);

        // Horizon line
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-600, 0 - pitchOffset);
        ctx.lineTo(600, 0 - pitchOffset);
        ctx.stroke();

        // Pitch ladder
        ctx.strokeStyle = '#FFFFFF';
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '14px Courier New';
        ctx.lineWidth = 1;
        for (var deg = -30; deg <= 30; deg += 5) {
            if (deg === 0) continue;
            var y = deg * pxPerDeg - pitchOffset;
            var len = (Math.abs(deg) % 10 === 0) ? 80 : 40;
            ctx.beginPath();
            ctx.moveTo(-len, -y);
            ctx.lineTo(len, -y);
            ctx.stroke();
            if (Math.abs(deg) % 10 === 0) {
                ctx.fillText(deg + '', len + 10, -y + 5);
                ctx.fillText(deg + '', -len - 30, -y + 5);
            }
        }

        ctx.restore(); // undo rotate/translate
        ctx.restore(); // undo clip

        // Aircraft reference (fixed, yellow)
        ctx.strokeStyle = '#FFFF00';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(CX - 80, CY);
        ctx.lineTo(CX - 25, CY);
        ctx.moveTo(CX + 25, CY);
        ctx.lineTo(CX + 80, CY);
        ctx.stroke();

        // Center dot
        ctx.fillStyle = '#FFFF00';
        ctx.beginPath();
        ctx.arc(CX, CY, 3, 0, Math.PI * 2);
        ctx.fill();

        // Roll indicator arc
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(CX, CY, 260, -Math.PI / 2 - Math.PI / 3, -Math.PI / 2 + Math.PI / 3);
        ctx.stroke();

        // Roll ticks
        for (var r = -60; r <= 60; r += 10) {
            var angle = -Math.PI / 2 + (r * Math.PI / 180);
            var inner = (Math.abs(r) === 30 || Math.abs(r) === 60) ? 243 : 250;
            var outer = 260;
            ctx.beginPath();
            ctx.moveTo(CX + inner * Math.cos(angle), CY + inner * Math.sin(angle));
            ctx.lineTo(CX + outer * Math.cos(angle), CY + outer * Math.sin(angle));
            ctx.stroke();
        }

        // Roll pointer (triangle that rotates with roll)
        ctx.save();
        ctx.translate(CX, CY);
        ctx.rotate(-roll * Math.PI / 180);
        ctx.beginPath();
        ctx.moveTo(0, -260);
        ctx.lineTo(-8, -275);
        ctx.lineTo(8, -275);
        ctx.closePath();
        ctx.fillStyle = '#FFFF00';
        ctx.fill();
        ctx.restore();
    }

    // =====================================================
    // DRAW AIRSPEED TAPE
    // =====================================================
    function drawAirspeedTape() {
        const as = smooth.airspeed || 0;
        const x = 20;
        const tapeTop = 100;
        const tapeBottom = 500;
        const tapeMid = (tapeTop + tapeBottom) / 2;
        const range = 40; // knots visible above/below center
        const pxPerKt = (tapeBottom - tapeTop) / (range * 2);

        // Background
        ctx.fillStyle = '#111';
        ctx.fillRect(x, tapeTop, 80, tapeBottom - tapeTop);

        // Border
        ctx.strokeStyle = '#FFF';
        ctx.lineWidth = 2;
        ctx.strokeRect(x, tapeTop, 80, tapeBottom - tapeTop);

        // Clip
        ctx.save();
        ctx.beginPath();
        ctx.rect(x, tapeTop, 80, tapeBottom - tapeTop);
        ctx.clip();

        // Tick marks
        ctx.strokeStyle = '#FFF';
        ctx.fillStyle = '#FFF';
        ctx.font = '12px Courier New';
        ctx.textAlign = 'right';
        const minKt = Math.floor(as - range);
        const maxKt = Math.ceil(as + range);
        for (let kt = minKt; kt <= maxKt; kt += 10) {
            const y = tapeMid - (kt - as) * pxPerKt;
            if (y < tapeTop || y > tapeBottom) continue;
            const len = (kt % 10 === 0) ? 20 : 10;
            ctx.beginPath();
            ctx.moveTo(x + 80, y);
            ctx.lineTo(x + 80 - len, y);
            ctx.stroke();
            if (kt % 10 === 0) {
                ctx.fillText(kt + '', x + 78, y + 4);
            }
        }
        ctx.restore();

        // Current speed box
        ctx.fillStyle = '#000';
        ctx.fillRect(x - 5, tapeMid - 15, 90, 30);
        ctx.strokeStyle = '#FFFF00';
        ctx.lineWidth = 2;
        ctx.strokeRect(x - 5, tapeMid - 15, 90, 30);
        ctx.fillStyle = '#FFFF00';
        ctx.font = '20px Courier New';
        ctx.textAlign = 'right';
        ctx.fillText(Math.round(as) + '', x + 80, tapeMid + 6);
    }

    // =====================================================
    // DRAW ALTITUDE TAPE
    // =====================================================
    function drawAltitudeTape() {
        const alt = smooth.altitude || 0;
        const x = W - 100;
        const tapeTop = 100;
        const tapeBottom = 500;
        const tapeMid = (tapeTop + tapeBottom) / 2;
        const range = 400; // feet visible above/below center
        const pxPerFt = (tapeBottom - tapeTop) / (range * 2);

        // Background
        ctx.fillStyle = '#111';
        ctx.fillRect(x, tapeTop, 80, tapeBottom - tapeTop);

        // Border
        ctx.strokeStyle = '#FFF';
        ctx.lineWidth = 2;
        ctx.strokeRect(x, tapeTop, 80, tapeBottom - tapeTop);

        // Clip
        ctx.save();
        ctx.beginPath();
        ctx.rect(x, tapeTop, 80, tapeBottom - tapeTop);
        ctx.clip();

        // Tick marks
        ctx.strokeStyle = '#FFF';
        ctx.fillStyle = '#FFF';
        ctx.font = '12px Courier New';
        ctx.textAlign = 'left';
        const minFt = Math.floor((alt - range) / 100) * 100;
        const maxFt = Math.ceil((alt + range) / 100) * 100;
        for (let ft = minFt; ft <= maxFt; ft += 100) {
            const y = tapeMid - (ft - alt) * pxPerFt;
            if (y < tapeTop || y > tapeBottom) continue;
            const len = (ft % 500 === 0) ? 20 : 10;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + len, y);
            ctx.stroke();
            if (ft % 500 === 0) {
                ctx.fillText(ft + '', x + 24, y + 4);
            }
        }
        ctx.restore();

        // Current altitude box
        ctx.fillStyle = '#000';
        ctx.fillRect(x - 5, tapeMid - 15, 90, 30);
        ctx.strokeStyle = '#FFFF00';
        ctx.lineWidth = 2;
        ctx.strokeRect(x - 5, tapeMid - 15, 90, 30);
        ctx.fillStyle = '#FFFF00';
        ctx.font = '20px Courier New';
        ctx.textAlign = 'right';
        ctx.fillText(Math.round(alt) + '', x + 80, tapeMid + 6);
    }

    // =====================================================
    // DRAW HEADING TAPE / COMPASS
    // =====================================================
    function drawHeadingTape() {
        const heading = smooth.heading_mag || 0;
        const tapeTop = 520;
        const tapeBottom = 580;
        const tapeMid = (tapeTop + tapeBottom) / 2;
        const range = 45; // degrees visible left/right of center
        const pxPerDeg = W / (range * 2);

        // Background
        ctx.fillStyle = '#111';
        ctx.fillRect(0, tapeTop, W, tapeBottom - tapeTop);

        // Clip
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, tapeTop, W, tapeBottom - tapeTop);
        ctx.clip();

        // Tick marks
        ctx.strokeStyle = '#FFF';
        ctx.fillStyle = '#FFF';
        ctx.font = '12px Courier New';
        ctx.textAlign = 'center';
        for (let deg = Math.floor(heading - range); deg <= Math.ceil(heading + range); deg += 5) {
            let actualDeg = deg;
            while (actualDeg < 0) actualDeg += 360;
            while (actualDeg >= 360) actualDeg -= 360;
            const x = CX + (deg - heading) * pxPerDeg;
            const len = (deg % 10 === 0) ? 15 : 8;
            ctx.beginPath();
            ctx.moveTo(x, tapeMid - 15);
            ctx.lineTo(x, tapeMid - 15 + len);
            ctx.stroke();
            if (deg % 10 === 0) {
                let label = actualDeg + '';
                if (actualDeg === 0) label = 'N';
                else if (actualDeg === 90) label = 'E';
                else if (actualDeg === 180) label = 'S';
                else if (actualDeg === 270) label = 'W';
                else label = (actualDeg / 10) + '';
                ctx.fillText(label, x, tapeMid + 18);
            }
        }
        ctx.restore();

        // Current heading box
        ctx.fillStyle = '#000';
        ctx.fillRect(CX - 30, tapeMid - 15, 60, 30);
        ctx.strokeStyle = '#FFFF00';
        ctx.lineWidth = 2;
        ctx.strokeRect(CX - 30, tapeMid - 15, 60, 30);
        ctx.fillStyle = '#FFFF00';
        ctx.font = '20px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText(Math.round(heading) + '', CX, tapeMid + 6);

        // Heading pointer (triangle at top)
        ctx.fillStyle = '#FFFF00';
        ctx.beginPath();
        ctx.moveTo(CX - 8, tapeTop);
        ctx.lineTo(CX + 8, tapeTop);
        ctx.lineTo(CX, tapeTop + 12);
        ctx.closePath();
        ctx.fill();
    }

    // =====================================================
    // DRAW VERTICAL SPEED INDICATOR
    // =====================================================
    function drawVSI() {
        const vs = smooth.vertical_speed || 0;
        const x = W - 50;
        const y = H - 50;
        const radius = 40;

        // Background
        ctx.fillStyle = '#111';
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#FFF';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Tick marks
        ctx.strokeStyle = '#FFF';
        ctx.fillStyle = '#FFF';
        ctx.font = '8px Courier New';
        ctx.textAlign = 'center';
        for (let v = -2000; v <= 2000; v += 500) {
            const angle = -Math.PI / 2 + (v / 2000) * (Math.PI * 0.75);
            const r1 = radius - 8;
            const r2 = radius - 2;
            ctx.beginPath();
            ctx.moveTo(x + r1 * Math.cos(angle), y + r1 * Math.sin(angle));
            ctx.lineTo(x + r2 * Math.cos(angle), y + r2 * Math.sin(angle));
            ctx.stroke();
            if (v % 1000 === 0) {
                ctx.fillText(Math.abs(v / 1000) + '', 
                    x + (radius + 8) * Math.cos(angle),
                    y + (radius + 8) * Math.sin(angle) + 3);
            }
        }

        // Needle
        const vsClamped = Math.max(-2500, Math.min(2500, vs));
        const needleAngle = -Math.PI / 2 + (vsClamped / 2000) * (Math.PI * 0.75);
        ctx.strokeStyle = '#FFFF00';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + (radius - 5) * Math.cos(needleAngle), y + (radius - 5) * Math.sin(needleAngle));
        ctx.stroke();
    }

    // =====================================================
    // DRAW NAV FREQUENCIES
    // =====================================================
    function drawNavInfo() {
        // NAV1 (top left)
        ctx.fillStyle = '#000';
        ctx.fillRect(20, H - 60, 120, 25);
        ctx.strokeStyle = '#0a0';
        ctx.lineWidth = 1;
        ctx.strokeRect(20, H - 60, 120, 25);
        ctx.fillStyle = '#00FF00';
        ctx.font = '14px Courier New';
        ctx.textAlign = 'left';
        const nav1 = d.nav1_freq ? d.nav1_freq.toFixed(2) : '---.--';
        ctx.fillText('NAV1: ' + nav1, 25, H - 42);

        // NAV2 (below NAV1)
        ctx.fillStyle = '#000';
        ctx.fillRect(20, H - 30, 120, 25);
        ctx.strokeStyle = '#0a0';
        ctx.strokeRect(20, H - 30, 120, 25);
        ctx.fillStyle = '#00FF00';
        const nav2 = d.nav2_freq ? d.nav2_freq.toFixed(2) : '---.--';
        ctx.fillText('NAV2: ' + nav2, 25, H - 12);
    }

    // =====================================================
    // DRAW BARO SETTING
    // =====================================================
    function drawBaro() {
        const baro = d.baro_pressure || 1013;
        const x = W - 120;
        const y = H - 70;
        ctx.fillStyle = '#000';
        ctx.fillRect(x, y, 100, 22);
        ctx.strokeStyle = '#0a0';
        ctx.lineWidth = 1;
        ctx.strokeRect(x, y, 100, 22);
        ctx.fillStyle = '#00FF00';
        ctx.font = '12px Courier New';
        ctx.textAlign = 'left';
        ctx.fillText('BARO: ' + baro.toFixed(1), x + 5, y + 16);
    }

    // =====================================================
    // MAIN RENDER LOOP
    // =====================================================
        function render() {
        // Interpolate all display values toward targets
        for (var key in smooth) {
            if (d[key] !== undefined && d[key] !== null) {
                smooth[key] += (d[key] - smooth[key]) * SMOOTH_FACTOR;
            }
        }

        // Clear
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, W, H);

        // Draw all components
        drawAttitudeIndicator();
        drawAirspeedTape();
        drawAltitudeTape();
        drawHeadingTape();
        drawVSI();
        drawNavInfo();
        drawBaro();

        // FPS counter
        frameCount++;
        const now = performance.now();
        if (now - lastFpsTime > 1000) {
            fpsText.textContent = frameCount + ' fps';
            frameCount = 0;
            lastFpsTime = now;
        }

        requestAnimationFrame(render);
    }

    // =====================================================
    // STARTUP
    // =====================================================
    // Fetch data every 100ms
        setInterval(fetchData, 10);
    fetchData();
        render();
    </script>
</body>
</html>
