<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PortalPanel PFD</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }
        /* STATUS BAR */
        #status-bar {
            position: fixed; top: 0; left: 0; right: 0;
            height: 30px; background: rgba(10,10,10,0.95);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 12px; font-size: 10px; color: #00FF00;
            font-family: 'Courier New', monospace; z-index: 100;
            transition: opacity 0.3s;
        }
        #status-bar.hidden { opacity: 0; pointer-events: none; }
        #status-text { font-weight: bold; }
        #fps-text { color: #888; }
        #fullscreen-btn {
            background: #222; border: 1px solid #444; color: #aaa;
            padding: 3px 10px; border-radius: 3px; font-size: 10px;
            cursor: pointer; font-family: 'Courier New', monospace; margin-left: 10px;
        }
        #fullscreen-btn:hover { background: #333; color: #fff; }
        /* UNIFIED BEZEL */
        #bezel {
            background: linear-gradient(145deg, #1a1a1a, #0d0d0d);
            border: 4px solid #2a2a2a;
            border-radius: 8px;
            box-shadow: 0 0 0 4px #0d0d0d, 0 0 20px rgba(0,0,0,0.8);
            padding: 12px;
            display: flex;
            gap: 8px;
            align-items: flex-start;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(1.4);
        }
        /* LEFT PANEL - NAV1, NAV2, BARO */
        #left-info {
            width: 90px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            justify-content: flex-end;
            padding-bottom: 10px;
        }
        .info-box {
            background: #000; border: 1px solid #00FF00; border-radius: 3px;
            padding: 6px 8px; color: #00FF00; font-size: 11px;
            font-family: 'Courier New', monospace; text-align: center;
        }
        .info-box .label { font-size: 8px; color: #888; margin-bottom: 2px; }
        .info-box .value { font-size: 14px; font-weight: bold; }
		.info-box .dme-box { font-size: 9px; color: #00FF66; margin-top: 2px; }
        .knob-btn {
            background: #1a1a1a; border: 1px solid #333; color: #00FFFF;
            font-size: 10px; padding: 1px 4px; border-radius: 2px;
            cursor: pointer; font-family: 'Courier New', monospace;
            margin: 0 1px; user-select: none; line-height: 1;
        }
        .knob-btn:hover { background: #003344; color: #fff; }
        .knob-btn:active { background: #00FFFF; color: #000; }
        .info-box .knob-row {
            display: flex; justify-content: center; gap: 2px; margin-top: 3px;
        }
        /* PFD CANVAS */
        #pfd-section { background: #000; border-radius: 4px; }
        #pfd-canvas { display: block; border-radius: 4px; }
        /* CENTER COLUMN - Soft keys + VSI */
        #center-column {
            width: 70px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding-top: 10px;
        }
        .softkey {
            background: #1a1a1a; border: 1px solid #333; border-radius: 3px;
            padding: 8px 4px; text-align: center; font-size: 8px; color: #666;
            font-family: 'Arial', sans-serif; cursor: pointer; user-select: none;
            transition: all 0.15s;
        }
        .softkey:hover { background: #2a2a2a; color: #aaa; border-color: #555; }
        .softkey:active { background: #333; color: #fff; }
        .softkey.active { background: #003344; color: #00FFFF; border-color: #006677; }
		.softkey.cdi-gps { background: #003300; color: #00FF66; border-color: #006600; }
        .softkey.cdi-vor { background: #330033; color: #FF00FF; border-color: #660066; }
		.softkey.nrst-active { background: #002244; color: #00AAFF; border-color: #0066AA; }
        #vsi-box { margin-top: 8px; display: flex; justify-content: center; }
        #vsi-canvas { display: block; }
    </style>
</head>
<body>
    <div id="status-bar">
        <span id="status-text">Connecting...</span>
        <div style="display: flex; align-items: center;">
            <span id="fps-text">0 fps</span>
            <div id="scale-control">
                <input type="range" id="scale-slider" min="80" max="200" value="100" step="5">
                <span id="scale-label">100%</span>
            </div>
            <button id="fullscreen-btn">Fullscreen</button>
        </div>
    </div>
    <div id="bezel">
        <div id="left-info">
            <div class="info-box">
                <div class="label">NAV1</div>
                <div class="value" id="info-nav1">---.--</div>
				<div class="dme-box" id="dme-nav1" style="display:none;">DME <span id="info-dme1">--.-</span> nm</div>
                <div class="knob-row">
                    <button class="knob-btn" onclick="sendKnob('NAV1_BIG_LEFT')">−−</button>
                    <button class="knob-btn" onclick="sendKnob('NAV1_SMALL_LEFT')">−</button>
                    <button class="knob-btn" onclick="sendKnob('NAV1_SWAP')">⇄</button>
                    <button class="knob-btn" onclick="sendKnob('NAV1_SMALL_RIGHT')">+</button>
                    <button class="knob-btn" onclick="sendKnob('NAV1_BIG_RIGHT')">++</button>
                </div>
            </div>
            <div class="info-box">
                <div class="label">NAV2</div>
                <div class="value" id="info-nav2">---.--</div>
				<div class="dme-box" id="dme-nav2" style="display:none;">DME <span id="info-dme2">--.-</span> nm</div>
                <div class="knob-row">
                    <button class="knob-btn" onclick="sendKnob('NAV2_BIG_LEFT')">−−</button>
                    <button class="knob-btn" onclick="sendKnob('NAV2_SMALL_LEFT')">−</button>
                    <button class="knob-btn" onclick="sendKnob('NAV2_SWAP')">⇄</button>
                    <button class="knob-btn" onclick="sendKnob('NAV2_SMALL_RIGHT')">+</button>
                    <button class="knob-btn" onclick="sendKnob('NAV2_BIG_RIGHT')">++</button>
                </div>
            </div>
            <div class="info-box">
                <div class="label">BARO</div>
                <div class="value" id="info-baro">----</div>
                <div class="knob-row">
                    <button class="knob-btn" onclick="sendKnob('BARO_LEFT')">−</button>
                    <button class="knob-btn" onclick="sendKnob('BARO_RIGHT')">+</button>
                </div>
            </div>
			<div class="info-box">
                <div class="label">CRS</div>
                <div class="value" id="info-crs">---</div>
                <div class="knob-row">
                    <button class="knob-btn" onclick="sendKnob('CRS_LEFT')">−</button>
                    <button class="knob-btn" onclick="sendKnob('CRS_RIGHT')">+</button>
                </div>
            </div>
			<div class="info-box">
                <div class="label">HDG BUG</div>
                <div class="value" id="info-hdg">---</div>
                <div class="knob-row">
                    <button class="knob-btn" onclick="sendKnob('HDG_LEFT')">−</button>
                    <button class="knob-btn" onclick="sendKnob('HDG_RIGHT')">+</button>
                </div>
            </div>
            <div class="info-box">
                <div class="label">OAT</div>
                <div class="value" id="info-oat">--°F</div>
            </div>
            <div class="info-box" id="wind-box" style="display:none;">
                <div class="label">WIND</div>
                <div class="value" id="info-wind" style="font-size:11px;">---°/--kt</div>
            </div>
        </div>
        <div id="pfd-section">
            <canvas id="pfd-canvas" width="600" height="600"></canvas>
        </div>
        <div id="center-column">
            <div class="softkey active">PFD</div>
            <div class="softkey">INSET</div>
            <div class="softkey" id="softkey-cdi" onclick="toggleCDI()">CDI</div>
            <div class="softkey" id="softkey-dme" onclick="toggleDME()">DME</div>
            <div class="softkey" id="softkey-nrst" onclick="toggleAirports()">NRST</div>
            <div class="softkey">BACK</div>
            <div class="softkey">ENT</div>
            <div id="vsi-box">
                <canvas id="vsi-canvas" width="60" height="60"></canvas>
            </div>
        </div>
    </div>
    <script>
    const canvas = document.getElementById('pfd-canvas');
    const ctx = canvas.getContext('2d');
    const vsiCanvas = document.getElementById('vsi-canvas');
    const vsiCtx = vsiCanvas.getContext('2d');
    const statusText = document.getElementById('status-text');
    const fpsText = document.getElementById('fps-text');
    const fullscreenBtn = document.getElementById('fullscreen-btn');
    const titleBar = document.getElementById('status-bar');
    const W = canvas.width;
    const H = canvas.height;
    const CX = W / 2;
    const CY = H / 2;
    let d = {};
    let smooth = {
        pitch: 0, roll: 0, airspeed: 0,
        altitude: 0, heading_mag: 0, vertical_speed: 0,
        baro_pressure: 1013, turn_rate: 0, slip_ball: 0,
        nav1_freq: 0, nav2_freq: 0
    };
    let smoothHdgBug = 0;
    let lastHdgBug = null;
    const SMOOTH_FACTOR = 0.35;
    let frameCount = 0;
    let lastFpsTime = performance.now();
    let prevAirspeed = null;
    let prevAirspeedTime = null;
    let prevAltitude = null;
    let prevAltitudeTime = null;
    let cachedAltTrendY = 300;
    let isAltTrendActive = false;
    let cachedTrendY = 300;
    let isTrendActive = false;

    // NRST airport overlay state (actual toggle lives on the MFD map)
    let showAirports = false;

    // =====================================================
    // SEND KNOB COMMAND TO SERVER
    // =====================================================
    function sendKnob(cmd) {
        if (socket && socket.connected) {
            socket.emit('knob_command', { cmd: cmd });
            console.log('[KNOB] Sent: ' + cmd);
        }
    }
	
	function toggleCDI() {
        if (socket && socket.connected) {
            socket.emit('knob_command', { cmd: 'CDI_TOGGLE' });
        }
        // Update visual state on next data tick (when MSFS replies)
    }
	
	let showDME = false;
    function toggleDME() {
        showDME = !showDME;
        var btn = document.getElementById('softkey-dme');
        if (btn) btn.classList.toggle('active', showDME);
        var dme1 = document.getElementById('dme-nav1');
        var dme2 = document.getElementById('dme-nav2');
        if (dme1) dme1.style.display = showDME ? 'block' : 'none';
        if (dme2) dme2.style.display = showDME ? 'block' : 'none';
        if (!showDME) {
            // When turning off, just hide the boxes
        } else {
            // When turning on, update immediately
            updateDME();
        }
    }
    function updateDME() {
        var dme1El = document.getElementById('info-dme1');
        var dme2El = document.getElementById('info-dme2');
        if (dme1El) dme1El.textContent = (d.nav1_dme && d.nav1_dme > 0) ? d.nav1_dme.toFixed(1) : '--.-';
        if (dme2El) dme2El.textContent = (d.nav2_dme && d.nav2_dme > 0) ? d.nav2_dme.toFixed(1) : '--.-';
    }

    function toggleAirports() {
        showAirports = !showAirports;
        var btn = document.getElementById('softkey-nrst');
        if (btn) btn.classList.toggle('nrst-active', showAirports);
        if (socket && socket.connected) {
            console.log('[NRST] Emitting toggle ->', showAirports);
            socket.emit('nrst_toggle', { show: showAirports });
        }
    }

    // WEBSOCKET
    let socket = null;
    function connectWebSocket() {
        try {
            socket = io('http://127.0.0.1:8090');
            socket.on('connect', function() { console.log('[WS] Connected'); });
            socket.on('nrst_state', function(payload) {
				var newShow = !!payload.show;
				if (newShow === showAirports) return;
				showAirports = newShow;
				var btn = document.getElementById('softkey-nrst');
				if (btn) btn.classList.toggle('nrst-active', showAirports);
			});
            socket.on('instrument_data', function(payload) {
                d = payload.data || {};
                if (payload.status) {
                    statusText.textContent = payload.status;
                    statusText.style.color = payload.connected ? '#00FF00' : '#FF8800';
                }
                updateSideInfo();
                updateDME();
				// Update CDI softkey color based on GPS/VOR source
                var cdiBtn = document.getElementById('softkey-cdi');
                if (cdiBtn) {
                    if (d.gps_cdi) {
                        cdiBtn.textContent = 'GPS';
                        cdiBtn.className = 'softkey cdi-gps';
                    } else {
                        cdiBtn.textContent = 'VOR';
                        cdiBtn.className = 'softkey cdi-vor';
                    }
                }
            });
            socket.on('disconnect', function() {
                statusText.textContent = 'Disconnected - retrying...';
                statusText.style.color = '#FF0000';
            });
            socket.on('connect_error', function() {
                statusText.textContent = 'Connection error - retrying...';
                statusText.style.color = '#FF0000';
            });
        } catch (e) {
            console.error('[WS] Error:', e);
            setTimeout(connectWebSocket, 2000);
        }
    }
    function updateSideInfo() {
        document.getElementById('info-nav1').textContent = d.nav1_freq ? d.nav1_freq.toFixed(2) : '---.--';
        document.getElementById('info-nav2').textContent = d.nav2_freq ? d.nav2_freq.toFixed(2) : '---.--';
        document.getElementById('info-baro').textContent = d.baro_pressure ? d.baro_pressure.toFixed(1) : '----';
		document.getElementById('info-crs').textContent = d.nav1_crs !== null && d.nav1_crs !== undefined ? Math.round(d.nav1_crs) + '°' : '---';
		document.getElementById('info-hdg').textContent = d.hdg_bug !== null && d.hdg_bug !== undefined ? Math.round(d.hdg_bug) + '°' : '---';
        var oatEl = document.getElementById('info-oat');
        if (oatEl) {
            if (d.oat !== null && d.oat !== undefined) {
                oatEl.textContent = Math.round(d.oat) + '°F';
            } else {
                oatEl.textContent = '--°F';
            }
        }
        var windEl = document.getElementById('info-wind');
        var windBox = document.getElementById('wind-box');
        if (windEl && windBox) {
            if (d.wind_dir !== null && d.wind_dir !== undefined && d.wind_speed !== null && d.wind_speed !== undefined) {
                var windAngle = Math.round(d.wind_dir);
                if (d.gps_magvar) {
                    windAngle = Math.round(d.wind_dir - d.gps_magvar);
                    if (windAngle < 0) windAngle += 360;
                    if (windAngle >= 360) windAngle -= 360;
                }
                windEl.textContent = windAngle + '°/' + Math.round(d.wind_speed) + 'kt';
                windBox.style.display = '';
            }
        }
    }
    // FULLSCREEN
    fullscreenBtn.addEventListener('click', function() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen();
            fullscreenBtn.textContent = 'Exit FS';
        } else {
            document.exitFullscreen();
            fullscreenBtn.textContent = 'Fullscreen';
        }
    });
    document.addEventListener('fullscreenchange', function() {
        fullscreenBtn.textContent = document.fullscreenElement ? 'Exit FS' : 'Fullscreen';
    });
    // SCALE SLIDER
    var scaleSlider = document.getElementById('scale-slider');
    var scaleLabel = document.getElementById('scale-label');
    var urlParams = new URLSearchParams(window.location.search);
    var initialScale = urlParams.get('scale');
    if (initialScale) {
        scaleSlider.value = initialScale;
        scaleLabel.textContent = initialScale + '%';
        var initScale = parseInt(initialScale) / 100;
        bezel.style.transform = 'translate(-50%, -50%) scale(' + initScale + ')';
    }
    scaleSlider.addEventListener('input', function() {
        var scale = scaleSlider.value / 100;
        scaleLabel.textContent = scaleSlider.value + '%';
        bezel.style.transform = 'translate(-50%, -50%) scale(' + scale + ')';
    });
    let hideTimeout = setTimeout(() => titleBar.classList.add('hidden'), 5000);
    document.addEventListener('mousemove', function(e) {
        if (e.clientY < 30) {
            titleBar.classList.remove('hidden');
            clearTimeout(hideTimeout);
            hideTimeout = setTimeout(() => titleBar.classList.add('hidden'), 3000);
        } else if (e.clientY > 40) {
            clearTimeout(hideTimeout);
            hideTimeout = setTimeout(() => titleBar.classList.add('hidden'), 500);
        }
    });
    // DRAW ATTITUDE INDICATOR
    function drawAttitudeIndicator() {
        var pitch = smooth.pitch || 0;
        var roll = smooth.roll || 0;
        var pxPerDeg = 5;
        ctx.save();
        ctx.beginPath();
        ctx.arc(CX, CY, 240, 0, Math.PI * 2);
        ctx.clip();
        ctx.save();
        ctx.translate(CX, CY);
        ctx.rotate(roll * Math.PI / 180);
        var pitchOffset = pitch * pxPerDeg;
        ctx.fillStyle = '#0A5FA5';
        ctx.fillRect(-600, -600 - pitchOffset, 1200, 600);
        ctx.fillStyle = '#5B3A0C';
        ctx.fillRect(-600, 0 - pitchOffset, 1200, 600);
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-600, 0 - pitchOffset);
        ctx.lineTo(600, 0 - pitchOffset);
        ctx.stroke();
        ctx.strokeStyle = '#FFFFFF';
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '12px Arial';
        ctx.lineWidth = 1;
        for (var deg = -30; deg <= 30; deg += 5) {
            if (deg === 0) continue;
            var y = deg * pxPerDeg - pitchOffset;
            var len = (Math.abs(deg) % 10 === 0) ? 80 : 40;
            ctx.beginPath();
            ctx.moveTo(-len, -y);
            ctx.lineTo(len, -y);
            ctx.stroke();
            if (Math.abs(deg) % 10 === 0) {
                ctx.fillText(deg + '', len + 10, -y + 5);
                ctx.fillText(deg + '', -len - 30, -y + 5);
            }
        }
        ctx.restore();
        ctx.restore();
        // Aircraft reference
        ctx.strokeStyle = '#FFFF00';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(CX - 80, CY); ctx.lineTo(CX - 25, CY);
        ctx.moveTo(CX + 25, CY); ctx.lineTo(CX + 80, CY);
        ctx.stroke();
        ctx.fillStyle = '#FFFF00';
        ctx.beginPath();
        ctx.arc(CX, CY, 3, 0, Math.PI * 2);
        ctx.fill();
        // Roll arc
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(CX, CY, 260, -Math.PI/2 - Math.PI/3, -Math.PI/2 + Math.PI/3);
        ctx.stroke();
        for (var r = -60; r <= 60; r += 10) {
            var angle = -Math.PI/2 + (r * Math.PI / 180);
            var inner = (Math.abs(r) === 30 || Math.abs(r) === 60) ? 243 : 250;
            var outer = 260;
            ctx.beginPath();
            ctx.moveTo(CX + inner * Math.cos(angle), CY + inner * Math.sin(angle));
            ctx.lineTo(CX + outer * Math.cos(angle), CY + outer * Math.sin(angle));
            ctx.stroke();
        }
        // Roll pointer
        ctx.save();
        ctx.translate(CX, CY);
        ctx.rotate(-roll * Math.PI / 180);
        ctx.beginPath();
        ctx.moveTo(0, -260); ctx.lineTo(-8, -275); ctx.lineTo(8, -275);
        ctx.closePath();
        ctx.fillStyle = '#FFFF00';
        ctx.fill();
        ctx.restore();

        // AUTOPILOT STATUS ANNUNCIATORS
        ctx.font = 'bold 16px Arial';
        ctx.textAlign = 'left';
        var apX = 110;
        var apY = 120;
        if (d.ap_master) {
            ctx.fillStyle = '#00FF00';
            ctx.fillText('AP', apX, apY);
            apY += 22;
        }
        if (d.ap_hdg_lock) {
            ctx.fillStyle = '#00FFFF';
            ctx.fillText('HDG', apX, apY);
            apY += 22;
        }
        if (d.ap_alt_lock) {
            ctx.fillStyle = '#00FFFF';
            ctx.fillText('ALT', apX, apY);
            apY += 22;
        }
        if (d.ap_nav_lock) {
            ctx.fillStyle = '#00FFFF';
            ctx.fillText('NAV', apX, apY);
            apY += 22;
        }
        if (d.ap_apr_lock) {
            ctx.fillStyle = '#00FFFF';
            ctx.fillText('APR', apX, apY);
            apY += 22;
        }
        if (d.ap_vs_lock) {
            ctx.fillStyle = '#00FFFF';
            ctx.fillText('VS', apX, apY);
        }
    }

    // FLIGHT DIRECTOR BARS
    function drawFlightDirector() {
        if (!d.ap_master && !d.ap_fdir_pitch && !d.ap_fdir_bank) return;
        var fdirBank = d.ap_fdir_bank || 0;
        var fdirPitch = d.ap_fdir_pitch || 0;
        if (fdirBank === 0 && fdirPitch === 0 && !d.ap_master) return;
        var bankOffset = (fdirBank / 25) * 80;
        bankOffset = Math.max(-80, Math.min(80, bankOffset));
        var pitchOffset = (fdirPitch / 20) * 80;
        pitchOffset = Math.max(-80, Math.min(80, pitchOffset));
        ctx.strokeStyle = '#FF00FF';
        ctx.lineWidth = 5;
        var targetX = CX + bankOffset;
        var targetY = CY - pitchOffset;
        ctx.beginPath();
        ctx.moveTo(targetX - 70, targetY + 70);
        ctx.lineTo(targetX - 20, targetY + 20);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(targetX + 70, targetY + 70);
        ctx.lineTo(targetX + 20, targetY + 20);
        ctx.stroke();
    }

    // CDI NEEDLE
    function drawCDI() {
        var cdiValue = 0;
        var hasSignal = false;
        if (d.gps_cdi) {
            var crossTrk = d.gps_cross_trk || 0;
            cdiValue = (crossTrk / 5.0) * 127;
            hasSignal = true;
        } else if (d.nav1_signal) {
            cdiValue = d.nav1_cdi || 0;
            hasSignal = true;
        }
        if (!hasSignal) return;
        var deflection = Math.max(-127, Math.min(127, cdiValue));
        var needleOffset = (deflection / 127) * 100;
        ctx.strokeStyle = '#FF00FF';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(CX - 120, CY - needleOffset);
        ctx.lineTo(CX - 30, CY - needleOffset);
        ctx.moveTo(CX + 30, CY - needleOffset);
        ctx.lineTo(CX + 120, CY - needleOffset);
        ctx.stroke();
        ctx.fillStyle = '#FFFFFF';
        for (var dot = -2; dot <= 2; dot++) {
            if (dot === 0) continue;
            var dotY = CY + dot * 30;
            if (Math.abs(dotY - CY) < 200) {
                ctx.beginPath();
                ctx.arc(CX, dotY, 3, 0, Math.PI * 2);
                ctx.fill();
            }
        }
    }
	
	    // =====================================================
    // GPS WAYPOINT INFO BAR (top of PFD)
    // =====================================================
    function drawGPSWaypointInfo() {
        var wpId = d.gps_wp_id;
        var wpDist = d.gps_wp_distance;
        var wpEte = d.gps_wp_ete;

        // Only draw if we have a waypoint identifier
        if (!wpId) return;

        // Format ETE: if > 60 min show HhMM, otherwise MM:SS
        var eteStr = '---';
        if (wpEte !== null && wpEte !== undefined && wpEte > 0) {
            if (wpEte >= 60) {
                var hrs = Math.floor(wpEte / 60);
                var mins = Math.round(wpEte % 60);
                eteStr = hrs + 'h' + (mins < 10 ? '0' + mins : mins) + 'm';
            } else {
                var mins = Math.floor(wpEte);
                var secs = Math.round((wpEte - mins) * 60);
                eteStr = (mins < 10 ? '0' + mins : mins) + ':' + (secs < 10 ? '0' + secs : secs);
            }
        }

        // Format distance
        var distStr = (wpDist !== null && wpDist !== undefined) ? wpDist.toFixed(1) + 'nm' : '----';

        // Box dimensions
        var boxW = 200;
        var boxH = 22;
        var boxX = CX - boxW / 2;
        var boxY = 5;

        // Draw background box
        ctx.fillStyle = '#000';
        ctx.fillRect(boxX, boxY, boxW, boxH);
        ctx.strokeStyle = '#00FF66';
        ctx.lineWidth = 1;
        ctx.strokeRect(boxX, boxY, boxW, boxH);

        // Draw text — identifier, distance, ETE
        ctx.font = 'bold 12px Courier New';
        ctx.fillStyle = '#00FF66';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        var padX = boxX + 10;
        ctx.fillText(wpId, padX, boxY + boxH / 2);

        ctx.textAlign = 'center';
        ctx.fillText(distStr, CX, boxY + boxH / 2);

        ctx.textAlign = 'right';
        ctx.fillText(eteStr, boxX + boxW - 10, boxY + boxH / 2);
    }

    // DRAW AIRSPEED TAPE
    function drawAirspeedTape() {
        var as = smooth.airspeed || 0;
        var x = 20, tapeTop = 100, tapeBottom = 500;
        var tapeMid = (tapeTop + tapeBottom) / 2;
        var range = 40, pxPerKt = (tapeBottom - tapeTop) / (range * 2);
        ctx.fillStyle = '#111'; ctx.fillRect(x, tapeTop, 80, tapeBottom - tapeTop);
        ctx.strokeStyle = '#FFF'; ctx.lineWidth = 2;
        ctx.strokeRect(x, tapeTop, 80, tapeBottom - tapeTop);
        ctx.save();
        ctx.beginPath(); ctx.rect(x, tapeTop, 80, tapeBottom - tapeTop); ctx.clip();
        ctx.strokeStyle = '#FFF'; ctx.fillStyle = '#FFF'; ctx.font = '12px Arial';
        for (var kt = Math.floor(as - range); kt <= Math.ceil(as + range); kt += 10) {
            var y = tapeMid - (kt - as) * pxPerKt;
            ctx.beginPath(); ctx.moveTo(x + 80, y); ctx.lineTo(x + 80 - 20, y); ctx.stroke();
            ctx.textAlign = 'left';
            ctx.fillText(kt + '', x + 5, y + 4);
        }
        ctx.restore();
        ctx.fillStyle = '#000'; ctx.fillRect(x - 5, tapeMid - 15, 90, 30);
        ctx.strokeStyle = '#FF00FF'; ctx.lineWidth = 2; ctx.strokeRect(x - 5, tapeMid - 15, 90, 30);
        ctx.fillStyle = '#FFFFFF'; ctx.font = '20px Arial'; ctx.textAlign = 'right';
        ctx.fillText(Math.round(as) + '', x + 80, tapeMid + 6);
        var now = performance.now();
        if (prevAirspeed !== null && prevAirspeedTime !== null) {
            var dt = (now - prevAirspeedTime) / 1000;
            if (dt > 0.25) {
                var rate = (smooth.airspeed - prevAirspeed) / dt;
                var trendKt = smooth.airspeed + rate * 6;
                cachedTrendY = tapeMid - (trendKt - as) * pxPerKt;
                cachedTrendY = Math.max(tapeTop + 10, Math.min(tapeBottom - 10, cachedTrendY));
                isTrendActive = Math.abs(cachedTrendY - tapeMid) > 3;
                prevAirspeed = smooth.airspeed;
                prevAirspeedTime = now;
            }
        } else {
            prevAirspeed = smooth.airspeed;
            prevAirspeedTime = now;
        }
        if (isTrendActive) {
            ctx.strokeStyle = '#FF00FF'; ctx.fillStyle = '#FF00FF'; ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(x + 80, tapeMid - 15);
            ctx.lineTo(x + 80, cachedTrendY);
            ctx.stroke();
            ctx.beginPath();
            if (cachedTrendY < tapeMid) {
                ctx.moveTo(x + 80, cachedTrendY);
                ctx.lineTo(x + 74, cachedTrendY + 10);
                ctx.lineTo(x + 86, cachedTrendY + 10);
            } else {
                ctx.moveTo(x + 80, cachedTrendY);
                ctx.lineTo(x + 74, cachedTrendY - 10);
                ctx.lineTo(x + 86, cachedTrendY - 10);
            }
            ctx.closePath();
            ctx.fill();
        }
    }

    // DRAW ALTITUDE TAPE
    function drawAltitudeTape() {
        var alt = smooth.altitude || 0;
        var x = W - 100, tapeTop = 100, tapeBottom = 500;
        var tapeMid = (tapeTop + tapeBottom) / 2;
        var range = 400, pxPerFt = (tapeBottom - tapeTop) / (range * 2);
        ctx.fillStyle = '#111'; ctx.fillRect(x, tapeTop, 80, tapeBottom - tapeTop);
        ctx.strokeStyle = '#FFF'; ctx.lineWidth = 2; ctx.strokeRect(x, tapeTop, 80, tapeBottom - tapeTop);
        ctx.save();
        ctx.beginPath(); ctx.rect(x, tapeTop, 80, tapeBottom - tapeTop); ctx.clip();
        ctx.strokeStyle = '#FFF'; ctx.fillStyle = '#FFF'; ctx.font = '12px Arial'; ctx.textAlign = 'left';
        for (var ft = Math.floor((alt - range) / 100) * 100; ft <= Math.ceil((alt + range) / 100) * 100; ft += 100) {
            var y = tapeMid - (ft - alt) * pxPerFt;
            if (y < tapeTop || y > tapeBottom) continue;
            var len = (ft % 500 === 0) ? 20 : 10;
            ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + len, y); ctx.stroke();
            if (ft % 500 === 0) ctx.fillText(ft + '', x + 24, y + 4);
        }
        ctx.restore();
        ctx.fillStyle = '#000'; ctx.fillRect(x - 5, tapeMid - 15, 90, 30);
        ctx.strokeStyle = '#FF00FF'; ctx.lineWidth = 2; ctx.strokeRect(x - 5, tapeMid - 15, 90, 30);
        ctx.fillStyle = '#FFFFFF'; ctx.font = '20px Arial'; ctx.textAlign = 'right';
        ctx.fillText(Math.round(alt) + '', x + 80, tapeMid + 6);
        var altNow = performance.now();
        if (prevAltitude !== null && prevAltitudeTime !== null) {
            var altDt = (altNow - prevAltitudeTime) / 1000;
            if (altDt > 0.25) {
                var altRate = (smooth.altitude - prevAltitude) / altDt;
                var trendAlt = smooth.altitude + altRate * 6;
                cachedAltTrendY = tapeMid - (trendAlt - alt) * pxPerFt;
                cachedAltTrendY = Math.max(tapeTop + 10, Math.min(tapeBottom - 10, cachedAltTrendY));
                isAltTrendActive = Math.abs(cachedAltTrendY - tapeMid) > 3;
                prevAltitude = smooth.altitude;
                prevAltitudeTime = altNow;
            }
        } else {
            prevAltitude = smooth.altitude;
            prevAltitudeTime = altNow;
        }
        if (isAltTrendActive) {
            ctx.strokeStyle = '#FF00FF'; ctx.fillStyle = '#FF00FF'; ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(x, tapeMid - 15);
            ctx.lineTo(x, cachedAltTrendY);
            ctx.stroke();
            ctx.beginPath();
            if (cachedAltTrendY < tapeMid) {
                ctx.moveTo(x, cachedAltTrendY);
                ctx.lineTo(x - 6, cachedAltTrendY + 10);
                ctx.lineTo(x + 6, cachedAltTrendY + 10);
            } else {
                ctx.moveTo(x, cachedAltTrendY);
                ctx.lineTo(x - 6, cachedAltTrendY - 10);
                ctx.lineTo(x + 6, cachedAltTrendY - 10);
            }
            ctx.closePath();
            ctx.fill();
        }
    }

    // DRAW HEADING TAPE
    function drawHeadingTape() {
        var heading = smooth.heading_mag || 0;
        var tapeTop = 520, tapeBottom = 580, tapeMid = (tapeTop + tapeBottom) / 2;
        var range = 45, pxPerDeg = W / (range * 2);
        ctx.fillStyle = '#111'; ctx.fillRect(0, tapeTop, W, tapeBottom - tapeTop);
        ctx.save();
        ctx.beginPath(); ctx.rect(0, tapeTop, W, tapeBottom - tapeTop); ctx.clip();
        ctx.strokeStyle = '#FFF'; ctx.fillStyle = '#FFF'; ctx.font = '12px Arial'; ctx.textAlign = 'center';
        var startDeg = Math.floor((heading - range) / 5) * 5;
        for (var deg = startDeg; deg <= heading + range; deg += 5) {
            var actualDeg = deg;
            while (actualDeg < 0) actualDeg += 360;
            while (actualDeg >= 360) actualDeg -= 360;
            var x = CX + (deg - heading) * pxPerDeg;
            var len = (deg % 10 === 0) ? 15 : 8;
            ctx.beginPath(); ctx.moveTo(x, tapeMid - 15); ctx.lineTo(x, tapeMid - 15 + len); ctx.stroke();
            if (deg % 10 === 0) {
                var label;
                if (actualDeg === 0) label = 'N';
                else if (actualDeg === 90) label = 'E';
                else if (actualDeg === 180) label = 'S';
                else if (actualDeg === 270) label = 'W';
                else label = (actualDeg / 10) + '';
                ctx.fillText(label, x, tapeMid + 18);
            }
        }
        ctx.restore();
        ctx.fillStyle = '#000'; ctx.fillRect(CX - 30, tapeMid - 15, 60, 30);
        ctx.strokeStyle = '#FF00FF'; ctx.lineWidth = 2; ctx.strokeRect(CX - 30, tapeMid - 15, 60, 30);
        ctx.fillStyle = '#FFFFFF'; ctx.font = '20px Arial'; ctx.textAlign = 'center';
        ctx.fillText(Math.round(heading) + '', CX, tapeMid + 6);
        ctx.fillStyle = '#FFFF00';
        ctx.beginPath(); ctx.moveTo(CX - 8, tapeTop); ctx.lineTo(CX + 8, tapeTop); ctx.lineTo(CX, tapeTop + 12);
        ctx.closePath(); ctx.fill();
        // Heading Bug (cyan marker)
        var hdgBug = smoothHdgBug || 0;
        var diff = hdgBug - heading;
        if (diff > 180) diff -= 360;
        if (diff < -180) diff += 360;
        var bugX = CX + diff * pxPerDeg;
        if (bugX > 0 && bugX < W) {
            ctx.fillStyle = '#00FFFF';
            ctx.strokeStyle = '#00FFFF';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(bugX, tapeTop);
            ctx.lineTo(bugX - 6, tapeTop - 6);
            ctx.lineTo(bugX - 6, tapeTop - 10);
            ctx.lineTo(bugX + 6, tapeTop - 10);
            ctx.lineTo(bugX + 6, tapeTop - 6);
            ctx.closePath();
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(bugX, tapeTop + 2);
            ctx.lineTo(bugX, tapeTop + 20);
            ctx.stroke();
        }
    }

    // DRAW VSI
    function drawVSI() {
        var vs = smooth.vertical_speed || 0;
        var c = vsiCanvas;
        var cx = c.width / 2, cy = c.height / 2, radius = 25;
        vsiCtx.fillStyle = '#111';
        vsiCtx.beginPath(); vsiCtx.arc(cx, cy, radius, 0, Math.PI * 2); vsiCtx.fill();
        vsiCtx.strokeStyle = '#FFF'; vsiCtx.lineWidth = 1; vsiCtx.stroke();
        vsiCtx.strokeStyle = '#FFF'; vsiCtx.fillStyle = '#FFF'; vsiCtx.font = '5px Arial'; vsiCtx.textAlign = 'center';
        for (var v = -2000; v <= 2000; v += 1000) {
            var angle = -Math.PI/2 + (v / 2000) * (Math.PI * 0.75);
            vsiCtx.beginPath();
            vsiCtx.moveTo(cx + (radius-4) * Math.cos(angle), cy + (radius-4) * Math.sin(angle));
            vsiCtx.lineTo(cx + radius * Math.cos(angle), cy + radius * Math.sin(angle));
            vsiCtx.stroke();
        }
        var vsClamped = Math.max(-2500, Math.min(2500, vs));
        var needleAngle = -Math.PI/2 + (vsClamped / 2000) * (Math.PI * 0.75);
        vsiCtx.strokeStyle = '#FFFF00'; vsiCtx.lineWidth = 2;
        vsiCtx.beginPath(); vsiCtx.moveTo(cx, cy);
        vsiCtx.lineTo(cx + (radius-3) * Math.cos(needleAngle), cy + (radius-3) * Math.sin(needleAngle));
        vsiCtx.stroke();
    }

    // MAIN RENDER LOOP
    function render() {
        var now = performance.now();
        if (!render.lastTime) render.lastTime = now;
        var dt = Math.min((now - render.lastTime) / 16.67, 3.0);
        render.lastTime = now;
        var lerpFactor = 1.0 - Math.pow(1.0 - SMOOTH_FACTOR, dt);
        for (var key in smooth) {
            if (d[key] !== undefined && d[key] !== null) {
                smooth[key] += (d[key] - smooth[key]) * lerpFactor;
            }
        }
        if (d.hdg_bug !== undefined && d.hdg_bug !== null) {
            var bugDeg = d.hdg_bug;
            if (d.gps_magvar !== undefined && d.gps_magvar !== null) {
                bugDeg = bugDeg - d.gps_magvar;
                if (bugDeg < 0) bugDeg += 360;
                if (bugDeg >= 360) bugDeg -= 360;
            }
            smoothHdgBug = bugDeg;
        }
        ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
        drawAttitudeIndicator();
        drawFlightDirector();
        drawAirspeedTape();
        drawAltitudeTape();
        drawHeadingTape();
        drawCDI();
        drawGPSWaypointInfo();
        drawVSI();
        frameCount++;
        if (now - lastFpsTime > 1000) {
            fpsText.textContent = frameCount + ' fps';
            frameCount = 0; lastFpsTime = now;
        }
        requestAnimationFrame(render);
    }
    // STARTUP
    connectWebSocket();
    render();
    </script>
</body>
</html>
