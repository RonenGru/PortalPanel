<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PortalPanel - G1000 Display</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        #container {
            display: flex;
            gap: 4px;
            background: #000;
        }
        #pfd-frame {
            width: 600px;
            height: 600px;
            border: 2px solid #1a1a1a;
            background: #000;
        }
        #mfd-frame {
            width: 600px;
            height: 600px;
            border: 2px solid #1a1a1a;
            background: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        .panel-label {
            color: #00FFFF;
            font-size: 10px;
            text-align: center;
            padding: 2px;
            background: #0a0a0a;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="pfd-frame">
            <div class="panel-label">PORTALPANEL - PFD</div>
            <iframe src="/pfd" id="pfd-iframe"></iframe>
        </div>
        <div id="mfd-frame">
            <div class="panel-label">PORTALPANEL - MFD</div>
            <iframe src="/mfd" id="mfd-iframe"></iframe>
        </div>
    </div>
</body>
</html>
