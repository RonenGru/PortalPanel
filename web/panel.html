<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:,">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PortalPanel Studio</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #111111; 
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #DDDDDD;
            display: flex;
            flex-direction: column;
            user-select: none;
        }

        /* TOP HEADER BAR */
        .app-header {
            width: 100%;
            height: 55px;
            background-color: #181818;
            border-bottom: 2px solid #222;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            box-sizing: border-box;
            z-index: 1002;
        }

        .header-logo {
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .logo-white { color: #FFFFFF; }
        .logo-cyan { color: #00FFFF; }

        .header-status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            font-weight: bold;
            color: #00FF00;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #00FF00;
            border-radius: 50%;
            box-shadow: 0 0 8px #00FF00;
        }

        /* MAIN WORKSPACE Layout */
        .app-workspace {
            display: flex;
            flex-grow: 1;
            width: 100%;
            height: calc(100% - 55px);
        }

        /* LEFT SIDEBAR */
        .sidebar {
            width: 320px;
            height: 100%;
            background-color: #181818;
            border-right: 2px solid #222;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            z-index: 1001;
        }

        .sidebar-scroll {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
            box-sizing: border-box;
        }

        .sidebar-section-title {
            color: #555555;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            margin-top: 20px;
        }

        /* Input design */
        .select-input {
            width: 100%;
            padding: 10px;
            background-color: #222;
            color: #FFF;
            border: 1px solid #333;
            border-radius: 6px;
            outline: none;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            box-sizing: border-box;
        }
        .select-input:focus {
            border-color: #00FFFF;
        }

        .panel-btn {
            width: 100%;
            padding: 12px;
            font-size: 13px;
            font-weight: bold;
            background-color: #222222;
            color: #FFFFFF;
            border: 1px solid #333;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .panel-btn:hover {
            background-color: rgba(0, 255, 255, 0.05);
            color: #00FFFF;
            border-color: #00FFFF;
        }
        .panel-btn.active {
            background-color: rgba(0, 255, 255, 0.1);
            border-color: #00FFFF;
            color: #00FFFF;
        }

        /* Coordinates Panel Container */
        .coords-panel {
            background-color: #222;
            border-radius: 6px;
            padding: 15px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .coords-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }
        .coord-field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .coord-field span {
            color: #666;
            font-size: 10px;
            font-weight: bold;
            text-align: center;
        }
        .coord-input {
            width: 100%;
            padding: 6px;
            background-color: #111;
            color: #FFF;
            border: 1px solid #444;
            border-radius: 4px;
            text-align: center;
            font-weight: bold;
            font-size: 12px;
            box-sizing: border-box;
            outline: none;
        }
        .coord-input:focus {
            border-color: #00FFFF;
        }

        .sidebar-btn-main {
            width: 100%;
            padding: 12px;
            font-size: 13px;
            font-weight: bold;
            background-color: #222222;
            color: #FFFFFF;
            border: 1px solid #00FFFF;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }
        .sidebar-btn-main:hover {
            background-color: #00FFFF;
            color: #000;
        }

        /* RIGHT DISPLAY CANVAS AREA */
        .canvas-area {
            flex-grow: 1;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #111111;
            position: relative;
            padding: 20px;
            box-sizing: border-box;
        }

        /* RAW MODE VIEWER */
        .viewport-raw {
            width: 100%;
            max-width: 1000px;
            aspect-ratio: 16 / 9;
            border: 2px solid #333;
            border-radius: 8px;
            overflow: hidden;
            background-color: #000;
            display: block;
        }
        .viewport-raw img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* 
           SERVER-SIDE CROPPED VIEWERS:
           Since the cropping is done in-memory on the Python side,
           no complex scaling or offsets are needed here! 
           The image renders natively in its clean cropped dimensions.
        */
        .viewport-cropped {
            width: auto;
            max-width: 90%;
            max-height: 80%;
            border: 3px solid #00FFFF;
            border-radius: 8px;
            overflow: hidden;
            background-color: #000;
            display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .viewport-cropped img {
            display: block;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <!-- TOP HEADER -->
    <div class="app-header">
        <div class="header-logo">
            <span class="logo-white">PORTAL</span><span class="logo-cyan">PANEL</span>
        </div>
        <div class="header-status">
            <span class="status-dot"></span>
            <span>MOCK ENGINE ONLINE (25 FPS)</span>
        </div>
    </div>

    <!-- MAIN APP WORKSPACE -->
    <div class="app-workspace">

        <!-- LEFT SIDEBAR CONTROLS -->
        <div class="sidebar">
            <div class="sidebar-scroll">
                
                <!-- Profile Manager Selection -->
                <div class="sidebar-section-title" style="margin-top: 0;">Active Profile</div>
                <select id="profile-select" class="select-input" style="margin-bottom: 20px;"></select>
                
                <!-- View Selector -->
                <div class="sidebar-section-title">Streaming Viewports</div>
                <div style="margin-bottom: 25px;">
                    <button class="panel-btn active" id="btn-view-raw">
                        <span>Full Texture Sheet</span>
                        <span style="color: #555; font-size: 11px;">Raw</span>
                    </button>
                    <button class="panel-btn" id="btn-view-pfd">
                        <span>PFD Display (Left)</span>
                        <span style="color: #00FFFF; font-size: 11px;">Cropped</span>
                    </button>
                    <button class="panel-btn" id="btn-view-mfd">
                        <span>MFD Display (Right)</span>
                        <span style="color: #00FFFF; font-size: 11px;">Cropped</span>
                    </button>
                </div>

                <!-- Interactive Coordinates Form -->
                <div class="sidebar-section-title">Smart Crop Coordinates</div>
                <div class="coords-panel" style="margin-bottom: 20px;">
                    <!-- PFD COORDS -->
                    <span style="font-size: 11px; font-weight: bold; color: #FFF; border-bottom: 1px dashed #333; padding-bottom: 5px;">PFD Crop Bounds</span>
                    <div class="coords-grid">
                        <div class="coord-field"><span>X</span><input type="number" id="pfd-x" class="coord-input" value="50"></div>
                        <div class="coord-field"><span>Y</span><input type="number" id="pfd-y" class="coord-input" value="140"></div>
                        <div class="coord-field"><span>W</span><input type="number" id="pfd-w" class="coord-input" value="860"></div>
                        <div class="coord-field"><span>H</span><input type="number" id="pfd-h" class="coord-input" value="800"></div>
                    </div>

                    <!-- MFD COORDS -->
                    <span style="font-size: 11px; font-weight: bold; color: #FFF; border-bottom: 1px dashed #333; padding-bottom: 5px; margin-top: 10px;">MFD Crop Bounds</span>
                    <div class="coords-grid">
                        <div class="coord-field"><span>X</span><input type="number" id="mfd-x" class="coord-input" value="1010"></div>
                        <div class="coord-field"><span>Y</span><input type="number" id="mfd-y" class="coord-input" value="140"></div>
                        <div class="coord-field"><span>W</span><input type="number" id="mfd-w" class="coord-input" value="860"></div>
                        <div class="coord-field"><span>H</span><input type="number" id="mfd-h" class="coord-input" value="800"></div>
                    </div>
                </div>

                <button class="sidebar-btn-main" id="btn-save-layout" style="margin-bottom: 20px;">SAVE CROP PROFILE</button>

            </div>
        </div>

        <!-- RIGHT DISPLAY CANVAS -->
        <div class="canvas-area">
            
            <!-- VIEW 1: FULL UN-CROPPED STREAM SHEET -->
            <div class="viewport-raw" id="view-raw-container">
                <img src="/stream/raw" alt="Live Raw Texture Feed">
            </div>

            <!-- VIEW 2: SERVER-SIDE CROPPED PFD VIEWPORT -->
            <div class="viewport-cropped" id="view-pfd-container">
                <img id="stream-pfd-img" src="/stream/crop/PFD" alt="Live Cropped PFD Feed">
            </div>

            <!-- VIEW 3: SERVER-SIDE CROPPED MFD VIEWPORT -->
            <div class="viewport-cropped" id="view-mfd-container">
                <img id="stream-mfd-img" src="/stream/crop/MFD" alt="Live Cropped MFD Feed">
            </div>

        </div>

    </div>

    <!-- FRONTEND JAVASCRIPT LOGIC -->
    <script>
        const profileSelect = document.getElementById('profile-select');
        const btnViewRaw = document.getElementById('btn-view-raw');
        const btnViewPfd = document.getElementById('btn-view-pfd');
        const btnViewMfd = document.getElementById('btn-view-mfd');

        const viewRawContainer = document.getElementById('view-raw-container');
        const viewPfdContainer = document.getElementById('view-pfd-container');
        const viewMfdContainer = document.getElementById('view-mfd-container');

        const streamPfdImg = document.getElementById('stream-pfd-img');
        const streamMfdImg = document.getElementById('stream-mfd-img');

        // Coordinate inputs
        const pfdX = document.getElementById('pfd-x');
        const pfdY = document.getElementById('pfd-y');
        const pfdW = document.getElementById('pfd-w');
        const pfdH = document.getElementById('pfd-h');

        const mfdX = document.getElementById('mfd-x');
        const mfdY = document.getElementById('mfd-y');
        const mfdW = document.getElementById('mfd-w');
        const mfdH = document.getElementById('mfd-h');

        const btnSaveLayout = document.getElementById('btn-save-layout');

        let activeProfileFilename = "";
        let currentAircraftName = "";

        // =====================================================================
        // LOAD AND LIST PROFILES FROM PYTHON BACKEND
        // =====================================================================
        function loadProfilesList() {
            fetch('/api/list_profiles')
                .then(res => res.json())
                .then(profiles => {
                    profileSelect.innerHTML = "";
                    profiles.forEach(p => {
                        const option = document.createElement('option');
                        option.value = p.filename;
                        option.textContent = p.aircraft_name;
                        profileSelect.appendChild(option);
                    });

                    // Select and load the first available profile on startup
                    if (profiles.length > 0) {
                        activeProfileFilename = profiles[0].filename;
                        loadProfileData(activeProfileFilename);
                    }
                })
                .catch(err => console.error("Error loading profiles:", err));
        }

        function loadProfileData(filename) {
            fetch(`/api/load_profile?filename=${encodeURIComponent(filename)}`)
                .then(res => res.json())
                .then(data => {
                    currentAircraftName = data.aircraft_name;
                    
                    // Populate coordinate inputs
                    const crops = data.crops || {};
                    if (crops.PFD) {
                        pfdX.value = crops.PFD.x;
                        pfdY.value = crops.PFD.y;
                        pfdW.value = crops.PFD.width;
                        pfdH.value = crops.PFD.height;
                    }
                    if (crops.MFD) {
                        mfdX.value = crops.MFD.x;
                        mfdY.value = crops.MFD.y;
                        mfdW.value = crops.MFD.width;
                        mfdH.value = crops.MFD.height;
                    }

                    // Reload the cropped image sources to force a clean socket connection
                    const timestamp = new Date().getTime();
                    streamPfdImg.src = `/stream/crop/PFD?t=${timestamp}`;
                    streamMfdImg.src = `/stream/crop/MFD?t=${timestamp}`;
                })
                .catch(err => console.error("Error loading active profile data:", err));
        }

        profileSelect.addEventListener('change', () => {
            activeProfileFilename = profileSelect.value;
            loadProfileData(activeProfileFilename);
        });

        // =====================================================================
        // SAVE PROFILE COORDINATES TO DISK
        // =====================================================================
        btnSaveLayout.addEventListener('click', (e) => {
            e.stopPropagation();
            const originalText = btnSaveLayout.textContent;
            btnSaveLayout.textContent = "SAVING...";
            btnSaveLayout.disabled = true;

            const payload = {
                aircraft_name: currentAircraftName,
                crops: {
                    PFD: {
                        x: parseInt(pfdX.value) || 0,
                        y: parseInt(pfdY.value) || 0,
                        width: parseInt(pfdW.value) || 100,
                        height: parseInt(pfdH.value) || 100
                    },
                    MFD: {
                        x: parseInt(mfdX.value) || 0,
                        y: parseInt(mfdY.value) || 0,
                        width: parseInt(mfdW.value) || 100,
                        height: parseInt(mfdH.value) || 100
                    }
                }
            };

            fetch('/api/save_profile', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "success") {
                    btnSaveLayout.textContent = "SAVED!";
                    btnSaveLayout.style.borderColor = "#00FF00";
                    btnSaveLayout.style.color = "#00FF00";
                    
                    // Force the stream graphics to reload dynamically to reflect new coordinates
                    loadProfileData(activeProfileFilename);

                    setTimeout(() => {
                        btnSaveLayout.textContent = originalText;
                        btnSaveLayout.style.borderColor = "#00FFFF";
                        btnSaveLayout.style.color = "#00FFFF";
                        btnSaveLayout.disabled = false;
                    }, 2000);
                } else {
                    alert(data.message || "Failed to save profile.");
                    btnSaveLayout.textContent = originalText;
                    btnSaveLayout.disabled = false;
                }
            })
            .catch(() => {
                alert("Error communicating with saving API.");
                btnSaveLayout.textContent = originalText;
                btnSaveLayout.disabled = false;
            });
        });

        // =====================================================================
        // VIEWPORT SWITCHER CONTROL
        // =====================================================================
        function selectActiveViewport(target) {
            document.querySelectorAll('.panel-btn').forEach(btn => btn.classList.remove('active'));
            
            viewRawContainer.style.display = 'none';
            viewPfdContainer.style.display = 'none';
            viewMfdContainer.style.display = 'none';

            if (target === 'raw') {
                btnViewRaw.classList.add('active');
                viewRawContainer.style.display = 'block';
            } else if (target === 'pfd') {
                btnViewPfd.classList.add('active');
                viewPfdContainer.style.display = 'block';
            } else if (target === 'mfd') {
                btnViewMfd.classList.add('active');
                viewMfdContainer.style.display = 'block';
            }
        }

        btnViewRaw.addEventListener('click', () => selectActiveViewport('raw'));
        btnViewPfd.addEventListener('click', () => selectActiveViewport('pfd'));
        btnViewMfd.addEventListener('click', () => selectActiveViewport('mfd'));

        // Initialize App on load
        loadProfilesList();
    </script>
</body>
</html>
